<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpsGenome — Deterministic Operational Memory & Infrastructure Grounding</title>
    
    <!-- Google Fonts: Inter & Fira Code (Linear / Apple aesthetic) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & Babel Standalone -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                        mono: ['Fira Code', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
                    },
                    colors: {
                        darkBg: '#050505',
                        darkCard: '#0C0C0D',
                        darkCardHover: '#141416',
                        darkBorder: 'rgba(255,255,255,0.10)',
                        darkBorderSubtle: 'rgba(255,255,255,0.06)',
                        darkTextPrimary: '#F5F5F5',
                        darkTextSecondary: '#8A8A8A',
                        darkTextMuted: '#5F5F5F',
                        
                        lightBg: '#FAFAF8',
                        lightCard: '#FFFFFF',
                        lightCardHover: '#F4F4F2',
                        lightBorder: 'rgba(0,0,0,0.10)',
                        lightBorderSubtle: 'rgba(0,0,0,0.05)',
                        lightTextPrimary: '#111111',
                        lightTextSecondary: '#666666',
                        lightTextMuted: '#999999',
                        
                        emerald: {
                            400: '#34D399',
                            500: '#10B981',
                            600: '#059669',
                            700: '#047857',
                            900: '#064E3B',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg-canvas: #FAFAF8;
            --surface-card: #FFFFFF;
            --surface-card-hover: #F4F4F2;
            --border-line: rgba(0, 0, 0, 0.10);
            --border-subtle: rgba(0, 0, 0, 0.05);
            --text-main: #111111;
            --text-sub: #666666;
            --text-muted: #999999;
            --accent-emerald: #10B981;
            --accent-muted: rgba(16, 185, 129, 0.10);
            --terminal-bg: #0C0C0D;
            --dot-color: rgba(0, 0, 0, 0.12);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
        }

        html.dark {
            --bg-canvas: #050505;
            --surface-card: #0C0C0D;
            --surface-card-hover: #141416;
            --border-line: rgba(255, 255, 255, 0.10);
            --border-subtle: rgba(255, 255, 255, 0.06);
            --text-main: #F5F5F5;
            --text-sub: #8A8A8A;
            --text-muted: #5F5F5F;
            --accent-emerald: #10B981;
            --accent-muted: rgba(16, 185, 129, 0.15);
            --terminal-bg: #070708;
            --dot-color: rgba(255, 255, 255, 0.10);
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-canvas);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-image: radial-gradient(var(--dot-color) 1.2px, transparent 1.2px);
            background-size: 24px 24px;
            letter-spacing: -0.012em;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        /* Industrial Panels & Cards */
        .eng-panel {
            background: var(--surface-card);
            border: 1px solid var(--border-line);
            border-radius: var(--radius-md);
        }

        .eng-card {
            background: var(--surface-card);
            border: 1px solid var(--border-line);
            border-radius: var(--radius-md);
            transition: border-color 0.15s ease, background-color 0.15s ease, transform 0.15s ease;
        }
        .eng-card:hover {
            border-color: rgba(16, 185, 129, 0.35);
            background: var(--surface-card-hover);
        }

        /* Industrial Buttons */
        .eng-btn-primary {
            background: #10B981;
            color: #050505;
            font-weight: 600;
            font-size: 13px;
            line-height: 20px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 16px;
            border: 1px solid #10B981;
            transition: all 0.15s ease;
            user-select: none;
        }
        .eng-btn-primary:hover {
            background: #34D399;
            border-color: #34D399;
        }
        .eng-btn-primary:active {
            transform: translateY(1px);
        }

        .eng-btn-secondary {
            background: transparent;
            color: var(--text-main);
            font-weight: 500;
            font-size: 13px;
            line-height: 20px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 16px;
            border: 1px solid var(--border-line);
            transition: all 0.15s ease;
            user-select: none;
        }
        .eng-btn-secondary:hover {
            background: var(--surface-card-hover);
            border-color: rgba(255, 255, 255, 0.25);
        }
        html:not(.dark) .eng-btn-secondary:hover {
            border-color: rgba(0, 0, 0, 0.25);
        }

        /* Industrial Badges */
        .eng-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.04em;
            line-height: 14px;
            text-transform: uppercase;
            border: 1px solid var(--border-line);
        }
        .eng-badge-emerald {
            background: var(--accent-muted);
            color: #10B981;
            border-color: rgba(16, 185, 129, 0.3);
        }
        .eng-badge-neutral {
            background: var(--border-subtle);
            color: var(--text-sub);
            border-color: var(--border-line);
        }
        .eng-badge-amber {
            background: rgba(245, 158, 11, 0.12);
            color: #F59E0B;
            border-color: rgba(245, 158, 11, 0.25);
        }
        .eng-badge-rose {
            background: rgba(244, 63, 94, 0.12);
            color: #F43F5E;
            border-color: rgba(244, 63, 94, 0.25);
        }

        /* Navigation Tab Items */
        .eng-tab-item {
            padding: 6px 14px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            color: var(--text-sub);
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid transparent;
        }
        .eng-tab-item:hover {
            color: var(--text-main);
            background: var(--surface-card-hover);
        }
        .eng-tab-active {
            color: var(--text-main);
            background: var(--surface-card);
            border-color: var(--border-line);
            font-weight: 600;
        }

        /* Scrubber & Slider */
        .eng-scrubber {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 4px;
            background: var(--border-line);
            border-radius: 2px;
            outline: none;
        }
        .eng-scrubber::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #10B981;
            cursor: pointer;
            border: 2px solid var(--bg-canvas);
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
            transition: transform 0.1s ease;
        }
        .eng-scrubber::-webkit-slider-thumb:hover {
            transform: scale(1.25);
        }

        /* Code & Monospace Blocks */
        pre, code, .font-mono {
            font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace;
        }

        /* Custom subtle scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-line);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Main OpsGenome Frontend App Script -->
    <script type="text/babel" src="/static/app.jsx"></script>
</body>
</html>
