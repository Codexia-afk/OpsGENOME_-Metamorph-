apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-engine
  namespace: payments
  labels:
    app: payment-engine
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payment-engine
  template:
    metadata:
      labels:
        app: payment-engine
    spec:
      containers:
      - name: payment
        image: payment-engine:v1.2.0
        ports:
        - containerPort: 8080
        resources:
          limits:
            memory: 64Mi # Severely undersized, causes OOMKilled
          requests:
            memory: 32Mi
