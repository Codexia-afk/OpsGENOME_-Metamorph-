apiVersion: v1
kind: Namespace
metadata:
  name: payments
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payments-config
  namespace: payments
data:
  DB_TIMEOUT: "30s"
  MAX_CONNECTIONS: "100"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-service
  namespace: payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-service
  template:
    metadata:
      labels:
        app: payments-service
    spec:
      containers:
      - name: payments
        image: busybox:1.36
        command: ["sh", "-c"]
        args:
        - |
          echo "Checking configuration: DB_TIMEOUT=$DB_TIMEOUT"
          if [ "$DB_TIMEOUT" = "30s" ]; then
            echo "Configuration healthy! Service active."
            while true; do sleep 3600; done
          else
            echo "FATAL: Invalid DB_TIMEOUT=$DB_TIMEOUT. Pod crashing!"
            exit 1
          fi
        env:
        - name: DB_TIMEOUT
          valueFrom:
            configMapKeyRef:
              name: payments-config
              key: DB_TIMEOUT
